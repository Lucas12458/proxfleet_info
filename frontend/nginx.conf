server {
    listen 80;

    # Nginx voit les fichiers à la racine car Traefik a "strippé" le préfixe
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # L'API reste accessible via /api/
    # (Note : Tes appels React pointeront vers /proxfleet/api/...)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
    }
}