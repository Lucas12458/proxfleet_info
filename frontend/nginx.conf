server {
    listen 80;
    server_name localhost;

    # 1. Gestion du Frontend (React)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html; # Indispensable pour React Router
    }

    # 2. Gestion du Backend (Reverse Proxy interne)
    location /api/ {
        proxy_pass http://backend:8000/; # "backend" est le nom du service dans docker-compose
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}