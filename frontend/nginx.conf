server {
    listen 80;

    # Nginx voit les fichiers à la racine car Traefik a "strippé" le préfixe
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # L'API reste accessible via /api/
    # (Note : Tes appels React pointeront vers /proxfleet/api/...)
    # Dans ton fichier nginx.conf interne
    location /api/ {
    # On retire le /api/ avant d'envoyer au backend si ton FastAPI 
    # n'a pas de préfixe /api dans son code.
    proxy_pass http://backend:8000/; 
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    }
}